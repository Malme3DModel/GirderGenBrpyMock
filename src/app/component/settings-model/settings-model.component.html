<h1 mat-dialog-title>モデル表示設定</h1>

<div mat-dialog-content>
<section class="example-section">
  <span class="example-list-section">
    <mat-checkbox class="example-margin"
                  [(ngModel)]="pavement.completed"
                  [color]="pavement.color"
                  (change)="redraw()">
      {{pavement.name}}
    </mat-checkbox>
  </span>
</section>

<section class="example-section">
  <span class="example-list-section">
    <mat-checkbox class="example-margin"
                  [(ngModel)]="slab.completed"
                  [color]="slab.color"
                  (change)="redraw()">
      {{slab.name}}
    </mat-checkbox>
  </span>
</section>

<section class="example-section">
  <span class="example-list-section">
    <mat-checkbox class="example-margin"
                  [(ngModel)]="beam.completed"
                  [color]="beam.color"
                  (change)="redraw()">
      {{beam.name}}
    </mat-checkbox>
  </span>
</section>

<section class="example-section">
  <span class="example-list-section">
    <mat-checkbox class="example-margin"
                  [checked]="allComplete"
                  [color]="mid.color"
                  [indeterminate]="someComplete()"
                  (change)="setAll($event.checked)">
      {{mid.name}}
    </mat-checkbox>
  </span>
  <span class="example-list-section">
    <ul>
      <li *ngFor="let subtask of mid.subtasks">
        <mat-checkbox [(ngModel)]="subtask.completed"
                      [color]="subtask.color"
                      (ngModelChange)="updateAllComplete()"
                      (change)="redraw()">
          {{subtask.name}}
        </mat-checkbox>
      </li>
    </ul>
  </span>
</section>

<section class="example-section">
  <span class="example-list-section">
    <mat-checkbox class="example-margin"
                  [checked]="allComplete2"
                  [color]="cross.color"
                  [indeterminate]="someComplete2()"
                  (change)="setAll2($event.checked)">
      {{cross.name}}
    </mat-checkbox>
  </span>
  <span class="example-list-section">
    <ul>
      <li *ngFor="let subtask of cross.subtasks">
        <mat-checkbox [(ngModel)]="subtask.completed"
                      [color]="subtask.color"
                      (ngModelChange)="updateAllComplete2()"
                      (change)="redraw()">
          {{subtask.name}}
        </mat-checkbox>
      </li>
    </ul>
  </span>
</section>

<section class="example-section">
  <span class="example-list-section">
    <mat-checkbox class="example-margin"
                  [(ngModel)]="crossbeam.completed"
                  [color]="crossbeam.color"
                  (change)="redraw()">
      {{crossbeam.name}}
    </mat-checkbox>
  </span>
</section>

<section class="example-section">
  <span class="example-list-section">
    <mat-checkbox class="example-margin"
                  [(ngModel)]="endbeam.completed"
                  [color]="endbeam.color"
                  (change)="redraw()">
      {{endbeam.name}}
    </mat-checkbox>
  </span>

<section class="example-section">
  <h3>モデルの外観設定</h3>
  
  <div class="appearance-controls">
    <div class="color-control">
      <label for="model-color">モデルの色:</label>
      <input type="color" 
             id="model-color"
             [(ngModel)]="model.modelAppearance.color"
             (change)="redraw()"
             class="color-picker">
    </div>
    
    <div class="opacity-control">
      <label for="model-opacity">透過度:</label>
      <mat-slider min="0" max="1" step="0.05" 
                  [(ngModel)]="model.modelAppearance.opacity"
                  (change)="redraw()"
                  class="opacity-slider">
      </mat-slider>
      <span class="opacity-value">{{(model.modelAppearance.opacity * 100).toFixed(0)}}%</span>
    </div>
  </div>
</section>

</section>
</div>

<div mat-dialog-actions>
  <button mat-button mat-dialog-close>閉じる</button>
</div>
