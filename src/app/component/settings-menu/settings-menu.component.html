<h1 mat-dialog-title>メニュー設定</h1>

<div mat-dialog-content>
    <section class="settings-section">
        <h3>サイドメニューの表示設定</h3>
        
        <div *ngIf="!isLod300" class="lod-restriction-notice">
            <mat-icon>info</mat-icon>
            <span>この設定はLOD300モードでのみ利用可能です。</span>
        </div>

        <div class="menu-visibility-controls" [class.disabled]="!isLod300">
            <div *ngFor="let item of menuItems" class="menu-item-control">
                <mat-checkbox 
                    [checked]="model.menuSettings.visibleMenus[item.key]"
                    [disabled]="!isLod300"
                    (change)="onMenuVisibilityChange(item.key, $event.checked)">
                    {{item.label}}
                </mat-checkbox>
            </div>
        </div>

        <p class="description" *ngIf="isLod300">
            チェックを外したメニュー項目はサイドメニューから非表示になります。
        </p>
    </section>
</div>

<div mat-dialog-actions>
    <button mat-button mat-dialog-close>閉じる</button>
</div>
